name: Render & Deploy Quarto Book to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "cloudflare-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Quarto Book & Deploy to books.osamata.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 & Jupyter for executable calculators
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install jupyter nbformat ipykernel

      - name: Set up Quarto CLI & TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Chrome Headless Shell (Mermaid diagrams in PDF/EPUB)
        run: quarto install chrome-headless-shell --no-prompt

      - name: Validate YAML metadata
        # safe_load with Date permitted: Ruby 3.1+ (Psych 4) rejects the
        # date-released value in CITATION.cff under plain YAML.load_file.
        run: |
          ruby -ryaml -rdate -e "['book/_quarto.yml', 'CITATION.cff', 'book/glossary.yml'].each { |f| YAML.safe_load(File.read(f), permitted_classes: [Date], aliases: true) }; puts 'YAML valid!'"

      - name: Render Quarto Book (HTML, PDF, EPUB, llms.txt, .llms.md)
        run: quarto render book

      - name: Write _headers and Worker configuration
        run: |
          cat << 'EOF' > "${GITHUB_WORKSPACE}/book/_book/_headers"
          /data-center-mep-qs/*.llms.md
            Content-Type: text/markdown; charset=utf-8
            Access-Control-Allow-Origin: *
            X-Content-Type-Options: nosniff

          /data-center-mep-qs/llms.txt
            Content-Type: text/plain; charset=utf-8
            Access-Control-Allow-Origin: *
            X-Content-Type-Options: nosniff

          /data-center-mep-qs/search.json
            Access-Control-Allow-Origin: *
          EOF

          mkdir -p "${RUNNER_TEMP}/cf-worker"
          cat << 'EOF' > "${RUNNER_TEMP}/cf-worker/worker.js"
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === "/" || url.pathname === "") {
                return Response.redirect(`${url.origin}/data-center-mep-qs/`, 302);
              }
              if (url.pathname === "/data-center-mep-qs") {
                return Response.redirect(`${url.origin}/data-center-mep-qs/`, 301);
              }
              if (url.pathname === "/llms.txt") {
                return Response.redirect(`${url.origin}/data-center-mep-qs/llms.txt`, 302);
              }
              if (env.ASSETS) {
                return env.ASSETS.fetch(request);
              }
              return new Response("Not Found", { status: 404 });
            }
          };
          EOF

          cat << EOF > "${RUNNER_TEMP}/cf-worker/wrangler.jsonc"
          {
            "name": "data-center-mep-qs",
            "main": "worker.js",
            "compatibility_date": "2026-11-19",
            "workers_dev": true,
            "routes": [
              {
                "pattern": "books.osamata.com",
                "custom_domain": true
              }
            ],
            "assets": {
              "directory": "${GITHUB_WORKSPACE}/book/_book",
              "binding": "ASSETS",
              "base_path": "/data-center-mep-qs",
              "html_handling": "auto-trailing-slash",
              "not_found_handling": "404-page"
            }
          }
          EOF

      - name: Deploy to Cloudflare Workers (books.osamata.com/data-center-mep-qs/)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ runner.temp }}/cf-worker
        run: npx --yes wrangler@latest deploy
